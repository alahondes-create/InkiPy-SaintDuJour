<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Couronne/Halo (style auréole) -->
  <circle cx="50" cy="25" r="22" stroke="#FFD700" fill="none" stroke-width="3"/>

  <!-- Pointes de la couronne -->
  <line x1="35" y1="10" x2="40" y2="15" stroke="#FFD700" stroke-width="2"/>
  <line x1="45" y1="8" x2="50" y2="13" stroke="#FFD700" stroke-width="2"/>
  <line x1="55" y1="10" x2="60" y2="15" stroke="#FFD700" stroke-width="2"/>
  <line x1="65" y1="15" x2="70" y2="10" stroke="#FFD700" stroke-width="2"/>

  <!-- Tête (neutre : homme ou femme) -->
  <circle cx="50" cy="50" r="18" stroke="black" fill="none" stroke-width="2"/>

  <!-- Corps (robe simple pour neutralité) -->
  <path d="M40,68 L60,68 L55,90 L45,90 Z" stroke="black" fill="none" stroke-width="2"/>
</svg>